<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="roundedCanvas">
      <rect x="0" y="0" width="1200" height="320" rx="20" />
    </clipPath>
    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g clip-path="url(#roundedCanvas)">
    <!-- Background -->
    <rect x="0" y="0" width="1200" height="320" fill="#0B1120" />

    <!-- subtle depth glow behind the graphic, kept faint -->
    <circle cx="900" cy="160" r="190" fill="url(#softGlow)" />

    <!-- faint vertical divider hinting at a two-column composition -->
    <line x1="608" y1="56" x2="608" y2="264" stroke="#1E293B" stroke-width="1" opacity="0.6" />

    <!-- ============ LEFT: IDENTITY ============ -->
    <rect x="70" y="94" width="34" height="3" rx="1.5" fill="#2563EB" />

    <text x="70" y="152" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="700"
          letter-spacing="2" fill="#CBD5E1">SEVINCXANIM</text>

    <text x="70" y="184" font-family="'Courier New', monospace" font-size="17" font-weight="600"
          letter-spacing="5" fill="#2563EB">FRONTEND DEVELOPER</text>

    <text x="70" y="213" font-family="'Courier New', monospace" font-size="12.5"
          letter-spacing="1.5" fill="#64748B">React &#183; Next.js &#183; JavaScript &#183; AI</text>

    <!-- ============ RIGHT: ABSTRACT UI / BROWSER COMPOSITION ============ -->
    <!-- window frame -->
    <rect x="660" y="72" width="420" height="176" rx="10" fill="#111827" stroke="#1E293B" stroke-width="1.5" />
    <line x1="660" y1="106" x2="1080" y2="106" stroke="#1E293B" stroke-width="1" />

    <!-- window controls -->
    <circle cx="681" cy="89" r="4" fill="#334155" />
    <circle cx="699" cy="89" r="4" fill="#334155" />
    <circle cx="717" cy="89" r="4" fill="#2563EB" />

    <!-- code-like content lines -->
    <rect x="682" y="127" width="170" height="7" rx="3.5" fill="#334155" />
    <rect x="682" y="147" width="250" height="7" rx="3.5" fill="#2563EB" opacity="0.85" />
    <rect x="936" y="147" width="6" height="9" fill="#DBEAFE" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <rect x="682" y="167" width="130" height="7" rx="3.5" fill="#334155" />
    <rect x="682" y="187" width="205" height="7" rx="3.5" fill="#334155" />
    <rect x="682" y="207" width="95" height="7" rx="3.5" fill="#1E293B" />

    <!-- minimal cursor -->
    <path d="M 812 205 L 812 226 L 817 221 L 821 229 L 825 227 L 821 219 L 828 219 Z"
          fill="#CBD5E1" opacity="0.9" />

    <!-- abstract connection points, drifting past the window edge -->
    <line x1="1080" y1="96" x2="1112" y2="76" stroke="#2563EB" stroke-width="1" opacity="0.35" />
    <line x1="1112" y1="76" x2="1140" y2="100" stroke="#2563EB" stroke-width="1" opacity="0.25" />
    <line x1="1112" y1="76" x2="1122" y2="118" stroke="#334155" stroke-width="1" opacity="0.4" />
    <circle cx="1112" cy="76" r="4.5" fill="#2563EB" />
    <circle cx="1140" cy="100" r="3" fill="#DBEAFE" opacity="0.8" />
    <circle cx="1122" cy="118" r="3" fill="#64748B" />

    <!-- small build/create/improve marker, tucked under the window -->
    <text x="682" y="243" font-family="'Courier New', monospace" font-size="10" letter-spacing="2" fill="#475569">01 BUILD</text>
    <text x="770" y="243" font-family="'Courier New', monospace" font-size="10" letter-spacing="2" fill="#475569">02 CREATE</text>
    <text x="866" y="243" font-family="'Courier New', monospace" font-size="10" letter-spacing="2" fill="#475569">03 IMPROVE</text>
  </g>
</svg>
